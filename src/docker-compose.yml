services:
  db:
    image: postgres:16-alpine
    container_name: rsi-db
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-ui:
    image: dpage/pgadmin4
    container_name: rsi-db-ui
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db-dashboard:
    image: metabase/metabase:latest
    container_name: rsi-db-dashboard
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_DBNAME: default-dashboard
      MB_DB_PORT: 5432
      MB_DB_HOST: db
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: