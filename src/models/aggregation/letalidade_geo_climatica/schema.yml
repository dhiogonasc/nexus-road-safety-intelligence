version: 2

models:
  - name: agg_letalidade_geo_climatica

    config:
      contract:
        enforced: true 

    columns:
      - name: id
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: mes
        data_type: integer

      - name: mes_nome
        data_type: varchar

      - name: regiao
        data_type: varchar

      - name: estado
        data_type: varchar

      - name: condicao_climatica
        data_type: varchar
        

      - name: total_ocorrencias
        data_type: bigint
        tests:
          - not_null

      - name: taxa_mortalidade
        data_type: decimal(5, 2)
        tests:
          - not_null

      - name: indice_mortalidade_ocorrencia
        data_type: decimal(5, 2)
        tests:
          - not_null