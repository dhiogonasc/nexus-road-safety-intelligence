version: 2

models:
  - name: agg_categorizacao_espacial
    description: "Categorização espacial - Ocorrências"
    columns:
      - name: id
        description: "Referência primária."
        tests:
          - unique
          - not_null

      - name: taxa_mortalidade_envolvido
        description: "Taxa de mortalidade por pessoa envolvida."
        tests:
          - not_null

      - name: taxa_mortalidade_ocorrencia
        description: "Taxa de mortalidade por ocorrência."
        tests:
          - not_null