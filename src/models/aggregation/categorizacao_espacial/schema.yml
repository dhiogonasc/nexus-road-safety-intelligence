version: 2

models:
  - name: agg_categorizacao_espacial

    config:
      contract:
        enforced: true 

    columns:
      - name: id
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: br
        data_type: integer

      - name: km
        data_type: decimal(13, 3)

      - name: sentido
        data_type: varchar

      - name: uf_sigla
        data_type: varchar

      - name: uf_nome
        data_type: varchar

      - name: municipio
        data_type: varchar

      - name: tipo_area
        data_type: varchar


      - name: tipo_acidente
        data_type: varchar

      - name: causa_acidente
        data_type: varchar

      - name: classificacao_acidente
        data_type: varchar


      - name: total_envolvidos
        data_type: bigint

      - name: total_mortos
        data_type: bigint

      - name: total_ocorrencias
        data_type: bigint

      - name: taxa_mortalidade
        data_type: decimal(5, 2)
        tests:
          - not_null

      - name: indice_mortalidade_ocorrencia
        data_type: decimal(5, 2)
        tests:
          - not_null

      - name: indice_envolvimento_ocorrencia
        data_type: decimal(5, 2)
        tests:
          - not_null