version: 2

models:
  - name: dim_tempo
  
    config:
      contract:
        enforced: true 

    columns:
      - name: sk_tempo
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: data
        data_type: date

      - name: ano
        data_type: integer

      - name: mes
        data_type: integer

      - name: semana
        data_type: integer

      - name: dia_semana
        data_type: integer

      - name: fase_dia
        data_type: integer

      - name: mes_nome
        data_type: varchar

      - name: dia_semana_nome
        data_type: varchar

      - name: fase_dia_desc
        data_type: varchar