version: 2

models:
  - name: dim_local

    config:
      contract:
        enforced: true 

    columns:
      - name: sk_local
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: br
        data_type: integer
      
      - name: regiao
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: [
                  'centro-oeste', 'nordeste', 
                  'norte', 'sudeste', 'sul', 
                  'não informado'
                ]

      - name: estado
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: [
                  'acre', 'alagoas', 'amapá', 'amazonas', 'bahia', 'ceará', 
                  'distrito federal', 'espírito santo', 'goiás', 'maranhão', 
                  'mato grosso', 'mato grosso do sul', 'minas gerais', 'pará', 
                  'paraíba', 'paraná', 'pernambuco', 'piauí', 'rio de janeiro', 
                  'rio grande do norte', 'rio grande do sul', 'rondônia', 
                  'roraima', 'santa catarina', 'são paulo', 'sergipe', 'tocantins',
                  'não informado'
                ]

      - name: zona
        data_type: varchar
        tests:
          - accepted_values:
              arguments:
                values: ['rural', 'urbano', 'não informado']