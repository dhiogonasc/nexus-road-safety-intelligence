version: 2

models:
  - name: dim_malha_rodoviaria

    config:
      contract:
        enforced: true 

    columns:
      - name: sk_malha_rodoviaria
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: br
        data_type: varchar
      
      - name: km
        data_type: decimal(8, 3)

      - name: sentido_via
        data_type: varchar

      - name: tracado_via
        data_type: varchar

      - name: tipo_pista
        data_type: varchar
