version: 2

models:
  - name: fct_ocorrencia
  
    config:
      contract:
        enforced: true 
        
    columns:
      - name: id
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: sk_categoria
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_categoria')
            to_columns: [sk_categoria]
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: sk_categoria

      - name: sk_clima
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_clima')
            to_columns: [sk_clima]
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('dim_clima')
                field: sk_clima

      - name: sk_malha_geografica
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_malha_geografica')
            to_columns: [sk_malha_geografica]
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('dim_malha_geografica')
                field: sk_malha_geografica

      - name: sk_malha_rodoviaria
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_malha_rodoviaria')
            to_columns: [sk_malha_rodoviaria]
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('dim_malha_rodoviaria')
                field: sk_malha_rodoviaria

      - name: sk_tempo
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_tempo')
            to_columns: [sk_tempo]
          - type: not_null
        tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo


      - name: total_envolvidos
        data_type: integer

      - name: total_mortos
        data_type: integer

      - name: total_feridos
        data_type: integer

      - name: total_ilesos
        data_type: integer