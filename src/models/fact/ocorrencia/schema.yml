version: 2

models:
  - name: fct_ocorrencia
    description: "Fato - Ocorrencias"
    columns:
      - name: sk_categoria
        description: "Referência de Categoria - Chave de substituição"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: sk_categoria

      - name: sk_clima
        description: "Referência de Clima - Chave de substituição"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_clima')
                field: sk_clima

      - name: sk_local
        description: "Referência de Local - Chave de substituição"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_local')
                field: sk_local

      - name: sk_tempo
        description: "Referência de Tempo - Chave de substituição"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: sk_tempo
