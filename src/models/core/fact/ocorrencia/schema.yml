version: 2

models:
  - name: fct_ocorrencia
  
    config:
      contract:
        enforced: true 
        
    columns:
      - name: id
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: sk_categoria
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_categoria')
            to_columns: [sk_categoria]
          - type: not_null

      - name: sk_clima
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_clima')
            to_columns: [sk_clima]
          - type: not_null

      - name: sk_local
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_local')
            to_columns: [sk_local]
          - type: not_null

      - name: sk_tempo
        data_type: varchar
        constraints:
          - type: foreign_key
            to: ref('dim_tempo')
            to_columns: [sk_tempo]
          - type: not_null


      - name: total_envolvidos
        data_type: integer

      - name: total_mortos
        data_type: integer