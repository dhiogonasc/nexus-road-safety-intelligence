version: 2

models:
  - name: fct_ocorrencia
  
    config:
      contract:
        enforced: true 
        
    columns:
      - name: id
        data_type: varchar
        constraints:
          - type: primary_key
          - type: not_null
        tests:
          - unique

      - name: sk_categoria
        data_type: varchar
        tests:
        - relationships:
            arguments:
              to: ref('dim_categoria')
              field: sk_categoria

      - name: sk_clima
        data_type: varchar
        tests:
        - relationships:
            arguments:
              to: ref('dim_clima')
              field: sk_clima

      - name: sk_local
        data_type: varchar
        tests:
        - relationships:
            arguments:
              to: ref('dim_local')
              field: sk_local

      - name: sk_tempo
        data_type: varchar
        tests:
        - relationships:
            arguments:
              to: ref('dim_tempo')
              field: sk_tempo

      - name: total_envolvidos
        data_type: integer

      - name: total_mortos
        data_type: integer