name: 'road_safety_intelligence'
version: '1.0.0'
config-version: 2

profile: 'src'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros/common", "macros/utils", "macros/ocorrencias"]
snapshot-paths: ["snapshots"]

target-path: "target" 
clean-targets:
  - "target"

vars:
  raw_ocorrencias_csv_path: "data/raw/acidentes/ocorrencias/*.csv"

models:
  road_safety_intelligence:
    staging:
      +database: "temp_{{ env_var('DB_NAME') }}"
      +tags: ['staging']

      ocorrencias:
        +materialized: table
      
    dimension:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "core"
      +tags: ['core', 'dimension']

      categoria:
        +materialized: incremental
        +on_schema_change: 'fail'

      clima:
        +materialized: incremental
        +on_schema_change: 'fail'

      local:
        +materialized: incremental
        +on_schema_change: 'fail'

      tempo:
        +materialized: incremental
        +on_schema_change: 'fail'
      
    fact:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "core"
      +tags: ['core', 'fact']

      ocorrencia:
        +materialized: incremental
        +on_schema_change: 'fail'
        
    aggregation:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "analytics"
      +tags: ['analytics']

      categorizacao_espacial:
        +materialized: incremental
        +on_schema_change: 'fail'

      categorizacao_temporal:
        +materialized: incremental
        +on_schema_change: 'fail'
