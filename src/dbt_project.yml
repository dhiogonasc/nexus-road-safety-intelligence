name: 'road_safety_intelligence'
version: '1.0.0'
config-version: 2

profile: 'src'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros/common", "macros/utils", "macros/ocorrencias"]
snapshot-paths: ["snapshots"]

target-path: "target" 
clean-targets:
  - "target"
  - "data/db"

vars:
  raw_ocorrencias_csv_path: "data/raw/acidentes/ocorrencias/*.csv"

models:
  road_safety_intelligence:
    staging:
      +database: "temp_{{ env_var('DB_NAME') }}"
      +tags: ['bronze', 'staging']

      ocorrencias:
        +materialized: table
      
    dimension:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "core"
      +tags: ['silver', 'core', 'dimension']

      categoria:
        +materialized: incremental
      clima:
        +materialized: incremental
      local:
        +materialized: incremental
      tempo:
        +materialized: incremental
      
    fact:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "core"
      +tags: ['silver', 'core', 'fact']

      ocorrencia:
        +materialized: incremental

    aggregation:
      +database: "pg_{{ env_var('DB_NAME') }}"
      +schema: "analytics"
      +tags: ['gold', 'analytics']

      categorizacao_espacial:
        +materialized: incremental
