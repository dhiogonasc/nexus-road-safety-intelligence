name: 'road_safety_intelligence'
version: '1.0.0'
config-version: 2

profile: 'src'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros/common", "macros/utils", "macros/ocorrencias"]
snapshot-paths: ["snapshots"]

target-path: "target" 
clean-targets:
  - "target"
  - "logs"

vars:
  raw_ocorrencias_csv_path: "data/raw/acidentes/ocorrencias/*.csv"

models:
  road_safety_intelligence:
    staging:
      +tags: ['staging']

      ocorrencias:
        +materialized: table
          
    core:
      +database: "pg_core"
      +tags: ['core']

      dimension:
        +tags: ['dimension']

        categoria:
          +materialized: incremental
          +on_schema_change: 'fail'

        clima:
          +materialized: incremental
          +on_schema_change: 'fail'

        local:
          +materialized: incremental
          +on_schema_change: 'fail'

        tempo:
          +materialized: incremental
          +on_schema_change: 'fail'
      
      fact:
        +tags: ['fact']

        ocorrencia:
          +materialized: incremental
          +on_schema_change: 'fail'
        
    analytics:
      +database: "pg_analytics"
      +tags: ['analytics']

      overview:
        +materialized: incremental
        +on_schema_change: 'fail'
