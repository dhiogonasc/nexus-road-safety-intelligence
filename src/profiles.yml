src:
  target: environment
  outputs:
    environment:
      type: duckdb
      path: target/temp_{{ env_var('DB_NAME') }}.duckdb
      threads: "{{ env_var('THREADS') | int }}"
      extensions:
        - postgres
      attach:
        - path: "postgresql://{{ env_var('DB_USER') }}:{{ env_var('DB_PASSWORD') }}@{{ env_var('DB_HOST') }}:{{ env_var('DB_PORT') }}/{{ env_var('DB_NAME') }}"
          alias: "pg_{{ env_var('DB_NAME') }}"
          type: postgres