src:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: target/stg.duckdb
      threads: 4
      extensions:
        - postgres
      attach:
        - path: "postgresql://{{ env_var('DBT_USER_CORE', 'admin-rsi-core') }}:{{ env_var('DBT_PASS_CORE', 'admin-rsi-core') }}@{{ env_var('DBT_HOST_CORE', 'localhost') }}:{{ env_var('DBT_PORT', 5432) }}/{{ env_var('DBT_NAME_CORE', 'rsi-core') }}"
          alias: "pg_core"
          type: postgres

        - path: "postgresql://{{ env_var('DBT_USER_ANALYTICS', 'admin-rsi-analytics') }}:{{ env_var('DBT_PASS_ANALYTICS', 'admin-rsi-analytics') }}@{{ env_var('DBT_HOST_ANALYTICS', 'localhost') }}:{{ env_var('DBT_PORT', 5433) }}/{{ env_var('DBT_NAME_ANALYTICS', 'rsi-analytics') }}"
          alias: "pg_analytics"
          type: postgres

    prod:
      type: duckdb
      path: target/stg.duckdb
      threads: 8
      extensions:
        - postgres
      attach:
        - path: "postgresql://{{ env_var('DBT_USER_CORE', 'admin-rsi-core') }}:{{ env_var('DBT_PASS_CORE', 'admin-rsi-core') }}@{{ env_var('DBT_HOST_CORE', 'localhost') }}:{{ env_var('DBT_PORT_CORE', 5432) }}/{{ env_var('DBT_NAME_CORE', 'rsi-core') }}"
          alias: "pg_core"
          type: postgres


        - path: "postgresql://{{ env_var('DB_USER') }}:{{ env_var('DB_PASSWORD') }}@{{ env_var('DB_HOST') }}:{{ env_var('DB_PORT') }}/{{ env_var('DB_NAME') }}?sslmode=require"
          alias: "pg_analytics"
          type: postgres