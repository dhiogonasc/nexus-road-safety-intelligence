services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_rsi_pei6
    restart: always
    environment:
      POSTGRES_DB: rsi_pei6
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rsi_pei6"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
